[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bin-tel"
version = "1.0.0"
description = "Bin-Tel — worldwide BIN/IIN lookup and financial-institution intelligence for the desktop."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Bin-Tel Project" }]
keywords = ["bin", "iin", "issuer", "banking", "fintech", "desktop", "pyqt6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "PyQt6>=6.6",
    "SQLAlchemy>=2.0.25",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pyinstaller>=6.6",
]

[project.scripts]
bin-tel = "app.main:main"
bin-tel-cli = "app.cli:main"

[project.gui-scripts]
"Bin-Tel" = "app.main:main"

[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gui: tests that construct Qt widgets",
    "slow: long running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []
