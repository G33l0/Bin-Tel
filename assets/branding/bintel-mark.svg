<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bin-Tel">
  <title>Bin-Tel</title>
  <desc>A hexagonal identification badge holding three data rows, a lookup marker and an orbital arc.</desc>
  <defs>
    <linearGradient id="btShell" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#22C8B4"/>
      <stop offset="55%" stop-color="#1E8FB0"/>
      <stop offset="100%" stop-color="#2B4C9B"/>
    </linearGradient>
    <linearGradient id="btCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101A2B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <clipPath id="btClip">
      <path d="M32 2.6 58.4 17.3v29.4L32 61.4 5.6 46.7V17.3Z"/>
    </clipPath>
  </defs>

  <!-- Outer identification badge: a hexagon reads as both a chip contact and a seal. -->
  <path d="M32 2.6 58.4 17.3v29.4L32 61.4 5.6 46.7V17.3Z" fill="url(#btShell)"/>
  <path d="M32 8.2 53.6 20.2v23.6L32 55.8 10.4 43.8V20.2Z" fill="url(#btCore)"/>

  <!-- Orbital arc: worldwide coverage, clipped to the badge. -->
  <g clip-path="url(#btClip)" opacity="0.55">
    <ellipse cx="32" cy="32" rx="27" ry="11" fill="none" stroke="#22C8B4" stroke-width="1.4"
             transform="rotate(-24 32 32)" opacity="0.75"/>
    <ellipse cx="32" cy="32" rx="27" ry="11" fill="none" stroke="#5B8DEF" stroke-width="1"
             transform="rotate(24 32 32)" opacity="0.5"/>
  </g>

  <!-- Structured data rows: the identification number resolving to a record. -->
  <g fill="#F2F6FB">
    <rect x="18" y="21.5" width="20" height="4.2" rx="2.1"/>
    <rect x="18" y="29.9" width="26" height="4.2" rx="2.1" opacity="0.92"/>
    <rect x="18" y="38.3" width="14" height="4.2" rx="2.1" opacity="0.72"/>
  </g>

  <!-- Lookup marker: the moment a BIN resolves to its issuer. -->
  <circle cx="44" cy="40.4" r="4.4" fill="#22C8B4"/>
  <circle cx="44" cy="40.4" r="1.7" fill="#0B1220"/>
</svg>
