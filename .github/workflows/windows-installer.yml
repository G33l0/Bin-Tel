# Build the Windows installer on a Windows machine, because PyInstaller does
# not cross-compile and Inno Setup does not run anywhere else. Start it from
# the Actions tab, or push a v* tag.
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # The repository carries a 26 MB dataset that the installer ships.
          # A shallow clone is fine; LFS is not in use.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Cheap insurance: a build that ships a broken application is worse than
      # one that fails. This is also the first time the suite runs on Windows,
      # where path handling and the Qt platform plugin differ from Linux.
      - name: Run the tests
        run: python -m pytest -q

      - name: Build the installer
        run: python scripts/build_installer.py

      # Prove the frozen application actually starts before publishing it. A
      # bundle that imports cleanly on the build machine can still miss a
      # hidden import, and --version is the cheapest thing that would catch it.
      - name: Check the frozen application runs
        run: |
          .\dist\Bin-Tel\Bin-Tel.exe --version
          if ($LASTEXITCODE -ne 0) { throw "The frozen application did not start" }

      - name: Confirm the dataset and its licence shipped
        shell: pwsh
        run: |
          $data = "dist\Bin-Tel\_internal\data\bin-lists"
          # CC BY 4.0 permits redistribution provided the attribution travels
          # with the data. An installer is redistribution, so a build missing
          # either file must not be published.
          foreach ($name in @("binlist-data.csv", "binlist-data.LICENSE.txt", "ATTRIBUTION.md")) {
            if (-not (Test-Path (Join-Path $data $name))) {
              throw "$name is missing from the bundle"
            }
          }
          Get-ChildItem $data | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Bin-Tel-Setup-Windows
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 30
